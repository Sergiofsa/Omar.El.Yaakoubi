<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL OMAR</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            color: black;
            text-align: center;
            margin: 0;
            font-weight: bold;
        }

        img {
            max-width: 350px;
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .contenedor {
                flex-direction: column;
            }

            h1 {
                font-size: 2.5rem;
            }

            img {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>VAS A SER COMIDO<br>POR EL OMAR</h1>
        <img src="IMG_20260310_182431_1272.jpg" alt="El Omar">
    </div>
</body>
</html>
