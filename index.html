<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL OMAR</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
body {
    margin: 0;
    height: 100vh;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.contenedor {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 20px;
}

.texto {
    font-size: 4rem;
    font-weight: bold;
    text-align: center;
}

.foto {
    width: 250px;
    height: 300px;
    overflow: hidden;
    border-radius: 15px;
}

.foto img {
    width: 100%;
    display: block;
}

/* --- NUEVOS ESTILOS PARA BOTONES --- */
.botones-area {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    justify-content: center;
}

.btn {
    padding: 15px 20px;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    transition: transform 0.2s;
}

.btn:active {
    transform: scale(0.95);
}

.rojo { background-color: #ff4d4d; }
.verde { background-color: #4CAF50; }

#emoji-destino {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 150px;
    z-index: 1000;
}

#mensaje-jamon {
    display: none;
    font-size: 1.5rem;
    color: #333;
    margin-top: 20px;
}

@media (max-width: 768px) {
    .contenedor {
        flex-direction: column;
    }

    .texto {
        font-size: 2.5rem;
    }

    .foto {
        width: 200px;
        height: 240px;
    }
}
</style>
</head>
<body>

<div class="contenedor">
    <div class="texto">
        VAS A SER COMIDO<br>
        POR EL OMAR
        
        <div class="botones-area">
            <button class="btn rojo" onclick="mostrarDestino()">ACEPTAR TU DESTINO</button>
            <button class="btn verde" onclick="mostrarJamon()">ALIMENTALE CON...</button>
        </div>

        <div id="mensaje-jamon">Mataste a Omar con una pata de jamón</div>
    </div>

    <div class="foto">
        <img src="omar.jpg" alt="El Omar">
    </div>
</div>

<div id="emoji-destino">☠️</div>

<script>
function mostrarDestino() {
    document.getElementById('emoji-destino').style.display = 'block';
    document.getElementById('mensaje-jamon').style.display = 'none';
    
    // Opcional: desaparece a los 3 segundos
    setTimeout(() => {
        document.getElementById('emoji-destino').style.display = 'none';
    }, 3000);
}

function mostrarJamon() {
    document.getElementById('mensaje-jamon').style.display = 'block';
    document.getElementById('emoji-destino').style.display = 'none';
}
</script>

</body>
</html>
